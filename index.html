<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- iOS Safari PWA behavior: lets the chat use safe-area insets (notch/home-bar)
         and keeps the status bar translucent so h-dvh fills correctly. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Primary SEO -->
    <title>Jolliday — AI Trip Planner | Plan Any Trip in One Chat</title>
    <meta name="description" content="Jolliday is the AI trip planner that creates personalized travel itineraries in under a minute. Get day-by-day plans with flights, hotels, activities, and booking links. Plan your next vacation, honeymoon, family trip, or weekend getaway with AI." />
    <meta name="keywords" content="AI trip planner, AI travel planner, trip planner, travel itinerary, AI itinerary generator, vacation planner, honeymoon planner, family trip planner, weekend getaway planner, travel AI, plan a trip, trip planning app" />
    <meta name="author" content="Jolliday" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#2d42b3" />
    <link rel="canonical" href="https://jolliday.online/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jolliday" />
    <meta property="og:title" content="Jolliday — AI Trip Planner | Any Trip. In One Chat." />
    <meta property="og:description" content="Your AI trip planner. Flights, hotels, activities — all in one conversation. Plan any trip in under a minute." />
    <meta property="og:url" content="https://jolliday.online/" />
    <meta property="og:image" content="https://jolliday.online/og-image.png" />
    <meta property="og:image:secure_url" content="https://jolliday.online/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jolliday — AI Trip Planner. Any trip. In one chat." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jolliday — AI Trip Planner | Any Trip. In One Chat." />
    <meta name="twitter:description" content="Your AI trip planner. Flights, hotels, activities — all in one conversation. Plan any trip in under a minute." />
    <meta name="twitter:image" content="https://jolliday.online/og-image.png" />
    <meta name="twitter:image:alt" content="Jolliday — AI Trip Planner. Any trip. In one chat." />
    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Jolliday",
      "url": "https://jolliday.online",
      "logo": "https://jolliday.online/favicon.svg",
      "description": "AI-powered trip planner that creates personalized travel itineraries with flights, hotels, and activities in under 60 seconds.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@jolliday.app",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Jolliday AI Trip Planner",
      "url": "https://jolliday.online",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "description": "Jolliday is an AI trip planner that generates complete, personalized travel itineraries in under 60 seconds. It covers flights, hotels, restaurants, activities, and day-by-day scheduling for any destination worldwide. Users describe their ideal trip and receive a ready-to-book plan instantly.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free 3-day trial with full access to AI trip planning"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "2400",
        "bestRating": "5"
      },
      "featureList": [
        "AI-generated day-by-day travel itineraries",
        "Real-time flight and hotel price comparison",
        "Personalized activity and restaurant recommendations",
        "Multi-city and road trip planning",
        "Family, couple, solo, and group trip support",
        "Direct booking links to trusted travel providers",
        "PDF export and trip sharing",
        "Budget tracking and currency conversion",
        "Packing list generation",
        "Works for any destination worldwide"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage (helps AI agents surface answers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Jolliday?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jolliday is an AI-powered trip planner that creates complete, personalized travel itineraries in under 60 seconds. It covers flights, hotels, activities, restaurants, and day-by-day scheduling for any destination worldwide."
          }
        },
        {
          "@type": "Question",
          "name": "How does Jolliday work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You tell Jolliday where you want to go, your travel dates, budget, and preferences. The AI instantly generates a full day-by-day itinerary with hotel recommendations, flight options, activities, and restaurant suggestions — all with direct booking links."
          }
        },
        {
          "@type": "Question",
          "name": "Is Jolliday free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jolliday offers a free 3-day trial with full access to all features. After the trial, you can choose a subscription plan. You can cancel anytime."
          }
        },
        {
          "@type": "Question",
          "name": "What destinations does Jolliday cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jolliday works for any destination worldwide — cities, islands, road trips, multi-country itineraries, and more. If you can travel there, Jolliday can plan it."
          }
        },
        {
          "@type": "Question",
          "name": "Can Jolliday plan family trips?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Jolliday's AI creates family-friendly itineraries that balance sightseeing with downtime, finds kid-friendly hotels, and includes activities suitable for all ages."
          }
        },
        {
          "@type": "Question",
          "name": "Does Jolliday book flights and hotels?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jolliday generates your complete itinerary with direct booking links to trusted providers like Booking.com and Skyscanner. You complete the booking on those platforms, staying in full control."
          }
        },
        {
          "@type": "Question",
          "name": "How is Jolliday different from other AI trip planners?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Jolliday generates complete, bookable itineraries in under 60 seconds with real-time pricing. It provides day-by-day plans with specific times, direct booking links, budget tracking, and supports any trip type — from weekend getaways to multi-week adventures."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: WebSite with SearchAction (for sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jolliday",
      "url": "https://jolliday.online",
      "description": "AI trip planner that creates personalized travel itineraries in under 60 seconds. Plan any trip — flights, hotels, activities, day-by-day schedules — through a simple chat interface.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://jolliday.online/chat?q={search_term_string}"
        },
        "query-input": "required name=search_term_string",
        "description": "Plan a trip by describing your destination, dates, budget, and preferences. Jolliday will generate a complete day-by-day itinerary with flights, hotels, and activities in under 60 seconds."
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
