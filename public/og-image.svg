<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5469e8"/>
      <stop offset="100%" stop-color="#2d42b3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft orbs -->
  <circle cx="1050" cy="100" r="220" fill="#5469e8" opacity="0.1"/>
  <circle cx="80" cy="560" r="180" fill="#7c4dff" opacity="0.08"/>

  <!-- Logo mark top-left -->
  <g transform="translate(90, 80)">
    <rect width="96" height="96" rx="24" fill="url(#mark)"/>
    <path d="M48 18 C49 31 52 43 62.5 46 C73 49 73 47.5 76 48 C73 48.5 73 47 62.5 50 C52 53 49 65 48 78 C47 65 44 53 33.5 50 C23 47 23 48.5 20 48 C23 47.5 23 49 33.5 46 C44 43 47 31 48 18 Z" fill="#ffffff"/>
    <circle cx="48" cy="48" r="2.5" fill="#5469e8"/>
  </g>

  <!-- Brand name -->
  <text x="210" y="148" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#0f172a">Jolliday</text>

  <!-- Main headline -->
  <text x="90" y="340" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="900" fill="#0f172a">Any trip.</text>
  <text x="90" y="470" font-family="Arial, Helvetica, sans-serif" font-size="128" font-weight="900" fill="#2d42b3">In one chat.</text>

  <!-- Subtitle -->
  <text x="90" y="540" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#475569">Your AI trip planner. Plan anywhere in minutes.</text>

  <!-- URL at bottom right -->
  <text x="1110" y="590" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#2d42b3">jolliday.online</text>
</svg>
